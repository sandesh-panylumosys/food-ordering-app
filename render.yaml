# Render Blueprint — deploys the API and the admin panel.
# Dashboard → New → Blueprint → select this repo. Fill the `sync: false` values in the dashboard.
services:
  - type: web
    name: ember-oak-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npx --yes pnpm@12.9.1 install --frozen-lockfile --filter "backend..." && npx --yes pnpm@12.9.1 --filter backend build
    startCommand: node apps/backend/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: 1
      - key: CORS_ORIGINS
        sync: false # e.g. https://ember-oak-admin.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: razorpay # demo server without Razorpay: mock + ALLOW_MOCK_PAYMENTS=true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: ember-oak-admin
    runtime: static
    buildCommand: npx --yes pnpm@12.9.1 install --frozen-lockfile --filter "admin..." && npx --yes pnpm@12.9.1 --filter admin build
    staticPublishPath: apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false # e.g. https://ember-oak-api.onrender.com/api
